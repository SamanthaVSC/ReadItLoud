app:
  name: "ReadItLoud"
  version: "0.1.0"

tts:
  default_engine: "piper"           # Options: piper, kokoro, coqui
  sample_rate: 22050
  volume: 0.8

cache:
  enabled: true
  directory: "./cache"
  max_size_mb: 500

ui:
  theme: "dark"
  window_width: 800
  window_height: 600

voices:
  piper:
    voice_dir: "core/engines_tts/piper_engine/voices"
  kokoro:
    voice_dir: "core/engines_tts/kokoro_engine/voices"
  coqui:
    voice_dir: "core/engines_tts/coqui_engine/voices"